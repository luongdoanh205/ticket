<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="100%" height="100%" fill="#f7f9fc"/><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172554}.title{font-size:28px;font-weight:700}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:16}.accent{fill:#fff1f2;stroke:#e11d48;stroke-width:3;rx:16}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#475569}.line{stroke:#64748b;stroke-width:3;fill:none}.arrow{marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs><text x="600" y="48" text-anchor="middle" class="title">Hoạt động nghiệp vụ đặt vé</text><rect x="370" y="85" width="260" height="70" class="accent"/><text x="500" y="119" text-anchor="middle" class="label">Bắt đầu</text><rect x="330" y="200" width="340" height="80" class="box"/><text x="500" y="234" text-anchor="middle" class="label">Chọn phim, suất và ghế</text><rect x="330" y="330" width="340" height="80" class="box"/><text x="500" y="364" text-anchor="middle" class="label">Kiểm tra ghế và suất còn hợp lệ</text><polygon points="500,450 650,520 500,590 350,520" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="500" y="526" text-anchor="middle" class="label">Ghế còn trống?</text><rect x="50" y="620" width="300" height="75" class="box"/><text x="200" y="654" text-anchor="middle" class="label">Thông báo lỗi, chọn lại</text><rect x="400" y="620" width="300" height="75" class="accent"/><text x="550" y="654" text-anchor="middle" class="label">Tạo đơn PENDING, giữ 10 phút</text><rect x="750" y="620" width="200" height="75" class="box"/><text x="850" y="654" text-anchor="middle" class="label">Thanh toán</text><path d="M500 155 L500 200" class="line arrow"/><path d="M500 280 L500 330" class="line arrow"/><path d="M500 410 L500 450" class="line arrow"/><path d="M350 520 L200 620" class="line arrow"/><text x="275" y="562"