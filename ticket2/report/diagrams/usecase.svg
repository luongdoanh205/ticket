<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><rect width="100%" height="100%" fill="#f7f9fc"/><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172554}.title{font-size:28px;font-weight:700}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:16}.accent{fill:#fff1f2;stroke:#e11d48;stroke-width:3;rx:16}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#475569}.line{stroke:#64748b;stroke-width:3;fill:none}.arrow{marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs><text x="600" y="48" text-anchor="middle" class="title">Luồng nghiệp vụ và quyền theo vai trò</text><rect x="40" y="90" width="220" height="110" class="accent"/><text x="150" y="124" text-anchor="middle" class="label">CUSTOMER</text><rect x="310" y="90" width="235" height="110" class="box"/><text x="427.5" y="124" text-anchor="middle" class="label">Tra cứu phim</text><text x="427.5" y="154" text-anchor="middle" class="small">chọn lịch chiếu</text><rect x="565" y="90" width="235" height="110" class="box"/><text x="682.5" y="124" text-anchor="middle" class="label">Chọn ghế</text><text x="682.5" y="154" text-anchor="middle" class="small">giữ chỗ 10 phút</text><rect x="820" y="90" width="235" height="110" class="box"/><text x="937.5" y="124" text-anchor="middle" class="label">Thanh toán</text><text x="937.5" y="154" text-anchor="middle" class="small">mô phỏng</text><rect x="1075" y="90" width="235" height="110" class="box"/><text x="1192.5" y="124" text-anchor="middle" class="label">Nhận vé QR</text><text x="1192.5" y="154" text-anchor="middle" class="small">đơn và hồ sơ</text><path d="M260 145 L310 145" class="line arrow"/><path d="M545 145 L595 145" class="line arrow"/><path d="M800 145 L850 145" class="line arrow"/><path d="M1055 145 L1105 145" class="line arrow"/><rect x="40" y="260" width="220" height="110" class="accent"/><text x="150" y="294" text-anchor="middle" class="label">STAFF</text><rect x="310" y="260" width="235" height="110" class="box"/><text x="427.5" y="294" text-anchor="middle" class="label">Chọn suất</text><text x="427.5" y="324" text-anchor="middle" class="small">tối đa 8 ghế</text><rect x="565" y="260" width="235" height="110" class="box"/><text x="682.5" y="294" text-anchor="middle" class="label">Nhập khách</text><text x="682.5" y="324" text-anchor="middle" class="small">tên, liên hệ tùy chọn</text><rect x="820" y="260" width="235" height="110" class="box"/><text x="937.5" y="294" text-anchor="middle" class="label">Ghi nhận tiền</text><text x="937.5" y="324" text-anchor="middle" class="small">CASH hoặc CARD</text><rect x="1075" y="260" width="235" height="110" class="box"/><text x="1192.5" y="294" text-anchor="middle" class="label">Phát vé QR</text><text x="1192.5" y="324" text-anchor="middle" class="small">đơn PAID</text><path d="M260 315 L310 315" class="line arrow"/><path d="M545 315 L595 315" class="line arrow"/><path d="M800 315 L850 315" class="line arrow"/><path d="M1055 315 L1105 315" class="line arrow"/><rect x="40" y="430" width="220" height="110" class="accent"/><text x="150" y="464" text-anchor="middle" class="label">MANAGER</text><rect x="310" y="430" width="235" height="110" class="box"/><text x="427.5" y="464" text-anchor="middle" class="label">Quản lý rạp</text><text x="427.5" y="494" text-anchor="middle" class="small">phim, phòng, ghế</text><rect x="565" y="430" width="235" height="110" class="box"/><text x="682.5" y="464" text-anchor="middle" class="label">Lập lịch chiếu</text><text x="682.5" y="494" text-anchor="middle" class="small">kiểm tra lịch</text><rect x="820" y="430" width="235" height="110" class="box"/><text x="937.5" y="464" text-anchor="middle" class="label">Theo dõi bán</text><text x="937.5" y="494" text-anchor="middle" class="small">đơn và doanh thu</text><rect x="1075" y="430" width="235" height="110" class="box"/><text x="11